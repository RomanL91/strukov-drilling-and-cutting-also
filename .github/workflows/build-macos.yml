name: Сборка под macOS

# Собирает .app на macOS-раннере GitHub и кладёт его в артефакты сборки.
# Запускается вручную, по тегу вида v1.0.0 и при изменениях в main.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Архитектура бандла"
        type: choice
        default: universal
        options:
          - universal # arm64 + x86_64, работает на любом маке
          - arm64 # только Apple Silicon, собирается быстрее
          - x64 # только Intel
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "app/**"
      - "main.py"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/build-macos.yml"

# Новый пуш отменяет незавершённую сборку той же ветки — минуты macOS
# на GitHub тарифицируются с множителем 10x.
concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Версия Flutter, которую требует Flet 0.86.3. Flet ставит её сам
  # в ~/flutter/<версия>; здесь она нужна только как ключ кеша.
  FLUTTER_VERSION: "3.44.8"

jobs:
  build:
    # macos-latest — это раннеры Apple Silicon (arm64)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Установить Poetry
        run: pipx install poetry

      - name: Кеш зависимостей Python
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      # Flutter весит больше гигабайта. Без кеша каждая сборка
      # тратит несколько минут только на его скачивание.
      - name: Кеш Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - name: Установить зависимости
        run: poetry install --no-interaction

      # Из тега v1.2.3 берём 1.2.3, иначе — версию из pyproject.toml.
      # Подставлять сюда имя ветки нельзя: flet ждёт номер вида x.y.z.
      - name: Определить версию
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(poetry version -s)"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Версия сборки: ${VERSION}"

      # Для macOS flet принимает только arm64 и x64. Слова "universal" он не
      # знает и проверку архитектур делает лишь для Android, поэтому неверное
      # значение молча доходит до сборщика и падает с "No arch directories
      # found". Универсальный бандл получается, когда флаг не передан вовсе.
      - name: Собрать .app
        run: |
          ARCH="${{ github.event.inputs.arch || 'universal' }}"
          if [ "$ARCH" = "universal" ]; then
            ARCH_ARGS=""
          else
            ARCH_ARGS="--arch $ARCH"
          fi
          echo "Архитектура: $ARCH (аргументы: ${ARCH_ARGS:-по умолчанию})"

          poetry run flet build macos $ARCH_ARGS \
            --build-version "${{ steps.version.outputs.value }}" \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --verbose \
            --yes

      # Артефакты GitHub теряют права на исполнение и симлинки внутри .app,
      # из-за чего распакованное приложение не запускается. ditto сохраняет
      # структуру бандла целиком.
      - name: Упаковать бандл через ditto
        run: |
          cd build/macos
          APP_PATH=$(find . -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Бандл .app не найден в build/macos"
            ls -la
            exit 1
          fi
          echo "Найден бандл: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" StrukovDrilling-macos.zip
          ls -lh StrukovDrilling-macos.zip

      - name: Выложить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: StrukovDrilling-macos-${{ github.event.inputs.arch || 'universal' }}
          path: build/macos/StrukovDrilling-macos.zip
          retention-days: 30
          if-no-files-found: error

      # Для тега v* дополнительно создаём релиз, чтобы ссылку
      # можно было отдать на участок, не заходя в Actions.
      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/macos/StrukovDrilling-macos.zip
          body: |
            Сборка под macOS.

            Приложение не подписано, поэтому при первом запуске macOS его
            заблокирует. Снять карантин:

                xattr -dr com.apple.quarantine /Applications/StrukovDrilling.app

            Либо правый клик по приложению → «Открыть» → «Открыть».
