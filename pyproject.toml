[tool.poetry]
name = "strukov-drilling-and-cutting-also"
version = "0.1.0"
description = "Передача производственных заданий из МойСклад на линию сверления и отреза"
authors = ["Егор <despadino@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pydantic = "^2.12.5"
pydantic-settings = "^2.13.1"
aiohttp = "^3.13.5"
flet = { version = "^0.86.3", extras = ["all"] }


# Метаданные сборки Flet.
# Без них имя приложения берётся из имени каталога проекта, поэтому
# локальная сборка и сборка в CI могли бы дать разный результат.
[tool.flet]
artifact = "StrukovDrilling"
product = "Струков — сверление и резка"
company = "Струков"
copyright = "© Струков"
org = "ru.strukov"
bundle_id = "ru.strukov.drilling"

[tool.flet.app]
module = "main"

# Приложение ходит в МойСклад и на станок по сети — без этого права
# macOS молча блокирует все исходящие соединения.
[tool.flet.macos.entitlement]
"com.apple.security.network.client" = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pyinstaller (>=6.21.0,<7.0.0) ; python_version >= \"3.11\" and python_version < \"3.16\""
]
